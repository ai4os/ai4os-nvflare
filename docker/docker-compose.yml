name: ${DOCKER_COMPOSE_NAME}
services:
  dashboard:
    hostname: "${DOCKER_COMPOSE_NAME}-dashboard.${BASE_DOMAIN}"
    ipc: host
    build:
      context: .
      args:
        NVF_REPO: ${NVF_REPO}
        NVF_VERSION: ${NVF_VERSION}
        NVF_BASE_IMAGE_DASHBOARD: ${NVF_BASE_IMAGE_DASHBOARD}
      dockerfile: Dockerfile-dashboard
    image: ai4os-nvflare-dashboard:${NVF_VERSION}
    container_name: ${DOCKER_NAMESPACE}dashboard
    environment:
      NVFL_CREDENTIAL: "${NVFL_DASHBOARD_USERNAME}:${NVFL_DASHBOARD_PASSWORD}"
      NVFL_SERVER1: "${NVFL_DASHBOARD_SERVER_SERVER1}"
      NVFL_HA_MODE: "${NVFL_DASHBOARD_SERVER_HA_MODE}"
      NVFL_OVERSEER: "${NVFL_DASHBOARD_SERVER_OVERSEER}"
      NVFL_SERVER2: "${NVFL_DASHBOARD_SERVER_SERVER2}"
      NVFL_PROJECT_SHORT_NAME: "${NVFL_DASHBOARD_PROJECT_SHORT_NAME}"
      NVFL_PROJECT_TITLE: "${NVFL_DASHBOARD_PROJECT_TITLE}"
      NVFL_PROJECT_DESCRIPTION: "${NVFL_DASHBOARD_PROJECT_DESCRIPTION}"
      NVFL_PROJECT_APP_LOCATION: "${NVFL_DASHBOARD_PROJECT_APP_LOCATION}"
      NVFL_PROJECT_STARTING_DATE: "${NVFL_DASHBOARD_PROJECT_STARTING_DATE}"
      NVFL_PROJECT_END_DATE: "${NVFL_DASHBOARD_PROJECT_END_DATE}"
      NVFL_PROJECT_PUBLIC: "${NVFL_DASHBOARD_PROJECT_PUBLIC}"
      NVFL_PROJECT_FROZEN: "${NVFL_DASHBOARD_PROJECT_FROZEN}"
      NVFL_LOGGING_LEVEL: "${NVFL_DASHBOARD_LOGGING_LEVEL}"
      VARIABLE_NAME: "app"
    labels:
      - 'traefik_instance=reverse_proxy'
      - 'traefik.enable=true'
      - 'traefik.docker.network=reverse_proxy'
      - 'traefik.http.routers.${DOCKER_COMPOSE_NAME}.entrypoints=websecure'
      - 'traefik.http.routers.${DOCKER_COMPOSE_NAME}.service=${DOCKER_COMPOSE_NAME}'
      - 'traefik.http.routers.${DOCKER_COMPOSE_NAME}.rule=Host(`${DOCKER_COMPOSE_NAME}-dashboard.${BASE_DOMAIN}`)'
      - 'traefik.http.services.${DOCKER_COMPOSE_NAME}.loadbalancer.server.url=http://${DOCKER_NAMESPACE}dashboard:80'
    networks:
      reverse_proxy:
        aliases:
          - ${DOCKER_COMPOSE_NAME}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    restart: always

networks:
  reverse_proxy:
    name: reverse_proxy
    external: true
